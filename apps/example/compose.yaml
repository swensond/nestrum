services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: nestrum
            POSTGRES_PASSWORD: integration-only
            POSTGRES_DB: nestrum_integration
        ports:
            - '127.0.0.1::5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U nestrum -d nestrum_integration']
            interval: 1s
            timeout: 5s
            retries: 30
